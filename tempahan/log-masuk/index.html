<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk — Tempahan Bilik Khas SMKAJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tempahan/assets/style.css?v=20260820-3">
<link rel="icon" type="image/png" href="/logo.png">
</head>
<body>

<header class="topnav">
  <div class="wrap bar">
    <a href="/tempahan/" class="brand">
      <img class="logo" src="/assets/logo-sekolah.png" alt="Logo SMKAJ">
      <div><h1>Tempahan Bilik Khas</h1><p>SMK Agama Jerlun</p></div>
    </a>
    <nav class="links">
      <a href="/" title="Laman utama sekolah">Utama</a>
      <a href="/tempahan/">Buat Tempahan</a>
      <a href="/tempahan/jadual/">Jadual Keseluruhan</a>
      <a href="/tempahan/senarai/">Senarai Tempahan</a>
      <a href="/tempahan/admin/" id="nav-admin" style="display:none">Admin</a>
    </nav>
    <div class="authbox" id="authbox">...</div>
  </div>
</header>

<main>
  <div class="card authcard">
    <h3 style="font-size:17px;margin-bottom:2px">Akaun Guru</h3>
    <p class="sub">Log masuk atau daftar akaun baharu untuk membuat tempahan. Tiada e-mel diperlukan.</p>

    <div class="tabrow">
      <button type="button" id="tab-masuk" class="active">Log Masuk</button>
      <button type="button" id="tab-daftar">Daftar</button>
    </div>

    <div id="pane-masuk">
      <label class="field-label">Nama Guru</label>
      <input type="text" id="in-nama" autocomplete="username" placeholder="Cth: Ustaz Syahir">
      <label class="field-label" style="margin-top:12px">Kata Laluan</label>
      <input type="password" id="in-pass" autocomplete="current-password">
      <p class="msg" id="masuk-msg" style="margin-top:10px"></p>
      <button type="button" class="btn-primary" id="btn-masuk" style="width:100%;margin-top:14px">Log Masuk</button>
    </div>

    <div id="pane-daftar" style="display:none">
      <label class="field-label">Nama Guru (dipaparkan pada tempahan)</label>
      <input type="text" id="up-nama" placeholder="Cth: Ustaz Syahir bin ...">
      <p style="font-size:11px;color:#94a3b8;margin:4px 0 0">Nama ini digunakan untuk log masuk.</p>
      <label class="field-label" style="margin-top:12px">Kata Laluan (min. 6 aksara)</label>
      <input type="password" id="up-pass" autocomplete="new-password">
      <p class="msg" id="daftar-msg" style="margin-top:10px"></p>
      <button type="button" class="btn-primary" id="btn-daftar" style="width:100%;margin-top:14px">Daftar Akaun</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="/tempahan/assets/common.js?v=20260824-1"></script>
<script src="/tempahan/assets/login.js?v=20260816-4"></script>
</body>
</html>
